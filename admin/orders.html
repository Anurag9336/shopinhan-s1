<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — ShopInHand Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="admin-shell">
  <nav class="admin-nav" id="admin-nav-slot"></nav>
  <main class="admin-main">
    <h2 style="color:var(--navy);margin-top:0">Orders</h2>
    <div class="panel" style="margin-bottom:16px;display:flex;gap:10px;align-items:center">
      <label style="font-size:13px;font-weight:600;color:var(--navy)">Filter:</label>
      <select id="status-filter" style="padding:8px 10px;border:1.5px solid var(--line);border-radius:7px">
        <option value="">All</option>
        <option value="pending">Pending</option>
        <option value="paid">Paid</option>
        <option value="confirmed">Confirmed</option>
        <option value="packed">Packed</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
        <option value="returned">Returned</option>
        <option value="refund_requested">Refund Requested</option>
      </select>
    </div>
    <table class="table">
      <thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Amount</th><th>Payment</th><th>Status</th><th>Invoice</th></tr></thead>
      <tbody id="orders-tbody"><tr><td colspan="8">Loading…</td></tr></tbody>
    </table>
  </main>
</div>

<script type="module">
import { requireAdmin, renderAdminNav } from '../js/admin-guard.js';
import { formatINR, showToast, escapeHtml, fetchAllOrders, updateOrderStatus } from '../js/store.js';

await requireAdmin();
renderAdminNav('orders');

const tbody = document.getElementById('orders-tbody');
const filterEl = document.getElementById('status-filter');
let orders = [];

async function load() {
  orders = await fetchAllOrders();
  render();
}

function render() {
  const filter = filterEl.value;
  const rows = filter ? orders.filter(o => o.status === filter) : orders;
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8">Koi order nahi mila.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(o => `
    <tr>
      <td>#${o.id.slice(0,8)}</td>
      <td>${o.createdAt ? new Date(o.createdAt).toLocaleDateString('en-IN') : '-'}</td>
      <td>${escapeHtml(o.customer?.name) || '-'}<br><span style="color:#8a93a6;font-size:12px">${escapeHtml(o.customer?.phone) || ''}</span></td>
      <td>${o.items?.map(i => `${escapeHtml(i.name)} ×${Number(i.qty)}`).join(', ')}</td>
      <td>${formatINR(o.amount)}</td>
      <td>${o.paymentMethod === 'COD' ? 'COD' : 'Online'}</td>
      <td>
        <select class="status-select" data-id="${o.id}" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;font-size:12px">
          ${['pending','paid','confirmed','packed','shipped','delivered','cancelled','returned','refund_requested'].map(s => `<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td><a href="../invoice.html?id=${o.id}" target="_blank" style="color:var(--navy);font-weight:700">📄 View</a></td>
    </tr>`).join('');

  tbody.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      await updateOrderStatus(sel.dataset.id, sel.value);
      showToast('Order status update ho gaya');
    });
  });
}

filterEl.addEventListener('change', render);
load().catch(err => { tbody.innerHTML = `<tr><td colspan="8" style="color:#D93025">Error: ${err.message}</td></tr>`; });
</script>
</body>
</html>
